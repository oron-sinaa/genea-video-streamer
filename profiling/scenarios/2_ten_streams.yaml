# Scale Test Scenario: 10 Streams
# Tests stress and scaling limits
# Expected: CPU ~5-6x baseline, memory proportional, may show bottlenecks

streams:
  - name: "camera-1"
    rtsp_url: "rtsp://rtsp-server:8554/stream1"  # Generated test stream
    hls_output: "/tmp/hls_output/camera-1/"
    transport: "tcp"
    reconnect:
      enabled: true
      initial_delay_ms: 1000
      max_delay_ms: 30000
      jitter_percent: 15
      stale_timeout_s: 10

