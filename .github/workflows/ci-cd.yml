name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    name: Build and Test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libavformat-dev \
            libavcodec-dev \
            libavutil-dev \
            libyaml-cpp-dev
      
      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake -S /home/runner/work/genea-video-streamer/genea-video-streamer \
                 -DCMAKE_BUILD_TYPE=Release
      
      - name: Build
        run: |
          cd build
          cmake --build . -j$(nproc)
      
      - name: Run Unit Tests - ReconnectPolicy
        run: |
          ./build/test_reconnect_policy
      
      - name: Run Unit Tests - PipelineHealth
        run: |
          ./build/test_pipeline_health
      
      - name: Run Integration Tests
        run: |
          chmod +x tests/integration/run_integration_tests.sh
          ./tests/integration/run_integration_tests.sh
      
      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: streamer-binary-release
          path: build/streamer
          retention-days: 7

  docker-build:
    runs-on: ubuntu-latest
    name: Build Docker Image
    needs: build-and-test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: genea-streamer:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Test Docker image
        run: |
          docker build -t genea-streamer:test .
          docker run --rm genea-streamer:test --help 2>/dev/null || true
      
      - name: Verify Docker image size
        run: |
          SIZE=$(docker images genea-streamer:test --format "{{.Size}}")
          echo "Docker image size: $SIZE"

  code-quality:
    runs-on: ubuntu-latest
    name: Code Quality Checks
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check for TODO comments
        run: |
          echo "Checking for outstanding TODOs..."
          TODO_COUNT=$(grep -r "TODO\|FIXME" src/ include/ --include="*.cpp" --include="*.h" | wc -l)
          echo "Found $TODO_COUNT TODO/FIXME comments"
      
      - name: Verify file structure
        run: |
          echo "Verifying required files exist..."
          test -f CMakeLists.txt || exit 1
          test -f Dockerfile || exit 1
          test -f docker-compose.yml || exit 1
          test -f config/rtsp-ingest.yaml || exit 1
          echo "✓ All required files present"

  notify:
    runs-on: ubuntu-latest
    name: Notify
    needs: [ build-and-test, docker-build, code-quality ]
    if: always()
    
    steps:
      - name: Check job status
        run: |
          if [ "${{ needs.build-and-test.result }}" == "success" ] && \
             [ "${{ needs.docker-build.result }}" == "success" ] && \
             [ "${{ needs.code-quality.result }}" == "success" ]; then
            echo "✅ All checks passed!"
            exit 0
          else
            echo "❌ Some checks failed"
            exit 1
          fi
