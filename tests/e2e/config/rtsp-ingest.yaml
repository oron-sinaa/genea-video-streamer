rtsp:
  url: "rtsp://rtsp-server:554/stream1"
  transport: "tcp"
  timeout_us: 5000000
  reconnect:
    enabled: true
    initial_delay_ms: 500
    max_delay_ms: 5000
    jitter_percent: 15
    stale_timeout_s: 5

http:
  listen_port: 8000
  hls_path: "/hls"

hls:
  output_dir: "/data/segments"
  segment_duration_s: 3
  archive_retention_hours: 2
  cleanup_interval_s: 300
  enable_discontinuity_markers: true
