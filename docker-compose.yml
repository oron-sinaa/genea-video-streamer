services:
  rtsp-server:
    image: bluenviron/mediamtx:latest
    container_name: rtsp-server
    restart: unless-stopped
    ports:
      - "8554:8554"  # RTSP server
    networks:
      - streamer-network
    environment:
      RTSP_PORT: "8554"
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  rtsp-generator:
    image: jrottenberg/ffmpeg:7.0-ubuntu
    container_name: rtsp-generator
    restart: unless-stopped
    command: >
      -hide_banner
      -loglevel error
      -f lavfi -re -i testsrc2=size=1280x720:rate=30
      -f lavfi -re -i sine=frequency=1000:sample_rate=48000
      -c:v libx264
      -preset veryfast
      -profile:v main
      -level:v 3.1
      -pix_fmt yuv420p
      -b:v 1M
      -maxrate 1M
      -bufsize 2M
      -g 60
      -keyint_min 60
      -sc_threshold 0
      -c:a aac
      -profile:a aac_low
      -b:a 128k
      -ar 48000
      -ac 2
      -rtsp_transport tcp
      -f rtsp
      rtsp://rtsp-server:8554/stream
    networks:
      - streamer-network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    depends_on:
      - rtsp-server

  streamer:
    image: genea-video-streamer:latest
    container_name: genea-video-streamer
    restart: unless-stopped
    volumes:
      - ./config:/etc/streamer:ro
      - ./hls_output:/data/hls_output
    ports:
      - "8080:8080"  # HTTP server: web player, REST API, HLS streaming
    networks:
      - streamer-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 512M
        reservations:
          cpus: '1'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      - rtsp-server
      - rtsp-generator

networks:
  streamer-network:
    driver: bridge
