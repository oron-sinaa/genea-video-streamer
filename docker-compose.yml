version: '3.8'

services:
  streamer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: genea-video-streamer
    restart: unless-stopped
    
    volumes:
      - ./config:/etc/streamer:ro
      - ./hls_output:/data/hls_output
    
    ports:
      - "8080:8080"  # HTTP server: web player, REST API, HLS streaming
    
    networks:
      - streamer-network
    
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 512M
        reservations:
          cpus: '1'
          memory: 256M
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  streamer-network:
    driver: bridge

