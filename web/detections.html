<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detection Gallery - genea-video-streamer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 8px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
        }

        .controls {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .control-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        label {
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        select, input {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            background: white;
            color: #333;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .stats {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 12px;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .detection-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }

        .detection-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.15);
        }

        .detection-image {
            width: 100%;
            height: 250px;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .detection-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .detection-image.loading {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .detection-info {
            padding: 15px;
        }

        .detection-type {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .detection-type.person {
            background: rgba(76, 175, 80, 0.1);
            color: #4CAF50;
        }

        .detection-type.car {
            background: rgba(33, 150, 243, 0.1);
            color: #2196F3;
        }

        .detection-confidence {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }

        .confidence-bar {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            overflow: hidden;
            margin: 8px 0;
        }

        .confidence-fill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #8BC34A);
            border-radius: 3px;
        }

        .detection-time {
            font-size: 12px;
            color: #999;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            border-radius: 8px;
            padding: 20px;
            max-width: 800px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            animation: slideUp 0.3s;
        }

        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #666;
            padding: 5px 10px;
        }

        .modal-close:hover {
            color: #333;
        }

        .modal-image {
            width: 100%;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .modal-info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .info-row {
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: #999;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 3px;
        }

        .info-value {
            color: #333;
            font-weight: 500;
        }

        .empty-state {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 8px;
            padding: 60px 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .empty-state-title {
            font-size: 18px;
            color: #333;
            margin-bottom: 8px;
        }

        .empty-state-text {
            color: #999;
            font-size: 14px;
        }

        .loading-spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(102, 126, 234, 0.1);
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 30px;
        }

        .pagination button {
            min-width: 40px;
            height: 40px;
            padding: 0;
        }

        .pagination button.active {
            background: #333;
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .error-message {
            background: #ffebee;
            border: 1px solid #ef5350;
            color: #c62828;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            .control-group {
                width: 100%;
            }

            select, input, button {
                width: 100%;
            }

            .gallery {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 10px;
            }

            .stat-card {
                min-width: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎥 Detection Gallery</h1>
            <p class="subtitle">Real-time object detection results from HLS video stream</p>
        </header>

        <div class="controls">
            <div class="control-group">
                <label for="filter-type">Object Type:</label>
                <select id="filter-type">
                    <option value="">All Objects</option>
                    <option value="person">People</option>
                    <option value="car">Vehicles</option>
                </select>
            </div>

            <div class="control-group">
                <label for="filter-hours">Time Range:</label>
                <select id="filter-hours">
                    <option value="1">Last Hour</option>
                    <option value="6">Last 6 Hours</option>
                    <option value="24">Last 24 Hours</option>
                    <option value="168">Last Week</option>
                </select>
            </div>

            <div class="control-group">
                <label for="min-confidence">Min Confidence:</label>
                <input type="range" id="min-confidence" min="0" max="1" step="0.05" value="0.5" style="width: 150px;">
                <span id="confidence-value">50%</span>
            </div>

            <button onclick="refreshDetections()">🔄 Refresh</button>
        </div>

        <div id="stats" class="stats"></div>

        <div id="error-container"></div>

        <div id="gallery" class="gallery">
            <div class="empty-state">
                <div class="loading-spinner"></div>
                <p style="margin-top: 20px;">Loading detections...</p>
            </div>
        </div>

        <div id="pagination" class="pagination"></div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <img id="modal-image" class="modal-image" src="" alt="Detection">
            <div class="modal-info">
                <div class="info-row">
                    <div class="info-label">Object Type</div>
                    <div class="info-value" id="modal-type">—</div>
                </div>
                <div class="info-row">
                    <div class="info-label">Confidence</div>
                    <div class="info-value" id="modal-confidence">—</div>
                </div>
                <div class="info-row">
                    <div class="info-label">Timestamp</div>
                    <div class="info-value" id="modal-time">—</div>
                </div>
                <div class="info-row">
                    <div class="info-label">Segment</div>
                    <div class="info-value" id="modal-segment">—</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        let allDetections = [];
        let filteredDetections = [];
        const ITEMS_PER_PAGE = 20;
        let currentPage = 1;

        // Update confidence display
        document.getElementById('min-confidence').addEventListener('input', (e) => {
            document.getElementById('confidence-value').textContent = Math.round(e.target.value * 100) + '%';
        });

        // Fetch and display detections
        async function refreshDetections() {
            try {
                clearError();
                showLoading();

                const hours = parseInt(document.getElementById('filter-hours').value);
                const response = await fetch(`${API_BASE}/api/detections/recent?hours=${hours}&limit=500`);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();
                allDetections = data.detections || [];

                // Load statistics
                try {
                    const statsResp = await fetch(`${API_BASE}/api/detections/stats`);
                    if (statsResp.ok) {
                        const stats = await statsResp.json();
                        updateStats(stats);
                    }
                } catch (e) {
                    console.warn('Failed to load stats:', e);
                }

                applyFilters();
            } catch (error) {
                showError('Failed to load detections: ' + error.message);
                console.error(error);
            }
        }

        function applyFilters() {
            const typeFilter = document.getElementById('filter-type').value;
            const minConfidence = parseFloat(document.getElementById('min-confidence').value);

            filteredDetections = allDetections.filter(det => {
                const typeMatch = !typeFilter || det.object_type === typeFilter;
                const confMatch = det.confidence >= minConfidence;
                return typeMatch && confMatch;
            });

            currentPage = 1;
            renderGallery();
        }

        function renderGallery() {
            const gallery = document.getElementById('gallery');
            const start = (currentPage - 1) * ITEMS_PER_PAGE;
            const end = start + ITEMS_PER_PAGE;
            const pageItems = filteredDetections.slice(start, end);

            if (pageItems.length === 0) {
                gallery.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🔍</div>
                        <div class="empty-state-title">No Detections Found</div>
                        <div class="empty-state-text">Try adjusting your filters or loading more recent detections</div>
                    </div>
                `;
                document.getElementById('pagination').innerHTML = '';
                return;
            }

            gallery.innerHTML = pageItems.map(det => `
                <div class="detection-card" onclick="openModal('${det.id}')">
                    <div class="detection-image ${!det.frame_path_annotated ? 'loading' : ''}">
                        ${det.frame_path_annotated ? `<img src="${API_BASE}/detections/frame/${det.id}" alt="Detection" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22%3E%3Crect fill=%22%23f0f0f0%22 width=%22200%22 height=%22200%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%23999%22 font-size=%2214%22%3EImage unavailable%3C/text%3E%3C/svg%3E'">` : ''}
                    </div>
                    <div class="detection-info">
                        <div class="detection-type ${det.object_type}">${det.object_type}</div>
                        <div class="detection-confidence">
                            <strong>${Math.round(det.confidence * 100)}%</strong> confidence
                        </div>
                        <div class="confidence-bar">
                            <div class="confidence-fill" style="width: ${det.confidence * 100}%"></div>
                        </div>
                        <div class="detection-time">${new Date(det.unix_timestamp * 1000).toLocaleString()}</div>
                    </div>
                </div>
            `).join('');

            renderPagination();
        }

        function renderPagination() {
            const totalPages = Math.ceil(filteredDetections.length / ITEMS_PER_PAGE);
            const pagination = document.getElementById('pagination');

            if (totalPages <= 1) {
                pagination.innerHTML = '';
                return;
            }

            let html = '';
            if (currentPage > 1) {
                html += `<button onclick="goToPage(${currentPage - 1})">← Previous</button>`;
            }

            for (let i = Math.max(1, currentPage - 2); i <= Math.min(totalPages, currentPage + 2); i++) {
                html += `<button onclick="goToPage(${i})" class="${i === currentPage ? 'active' : ''}">${i}</button>`;
            }

            if (currentPage < totalPages) {
                html += `<button onclick="goToPage(${currentPage + 1})">Next →</button>`;
            }

            pagination.innerHTML = html;
        }

        function goToPage(page) {
            currentPage = page;
            renderGallery();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function updateStats(stats) {
            const container = document.getElementById('stats');
            const byType = stats.by_type || {};

            container.innerHTML = `
                <div class="stat-card">
                    <div class="stat-value">${stats.total_detections || 0}</div>
                    <div class="stat-label">Total Detections</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${byType.person || 0}</div>
                    <div class="stat-label">People Detected</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${byType.car || 0}</div>
                    <div class="stat-label">Vehicles Detected</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${Math.round((stats.average_confidence || 0) * 100)}%</div>
                    <div class="stat-label">Avg Confidence</div>
                </div>
            `;
        }

        function openModal(detectionId) {
            const det = allDetections.find(d => d.id == detectionId);
            if (!det) return;

            document.getElementById('modal-type').textContent = det.object_type.toUpperCase();
            document.getElementById('modal-confidence').textContent = `${Math.round(det.confidence * 100)}%`;
            document.getElementById('modal-time').textContent = new Date(det.unix_timestamp * 1000).toLocaleString();
            document.getElementById('modal-segment').textContent = det.segment_filename || '—';

            if (det.frame_path_annotated) {
                document.getElementById('modal-image').src = `${API_BASE}/detections/frame/${det.id}`;
            }

            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        function showError(message) {
            const container = document.getElementById('error-container');
            container.innerHTML = `<div class="error-message">${message}</div>`;
        }

        function clearError() {
            document.getElementById('error-container').innerHTML = '';
        }

        function showLoading() {
            document.getElementById('gallery').innerHTML = `
                <div class="empty-state">
                    <div class="loading-spinner"></div>
                    <p style="margin-top: 20px;">Loading detections...</p>
                </div>
            `;
        }

        // Filters trigger refresh
        document.getElementById('filter-type').addEventListener('change', applyFilters);
        document.getElementById('filter-hours').addEventListener('change', refreshDetections);
        document.getElementById('min-confidence').addEventListener('change', applyFilters);

        // Close modal on background click
        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('modal')) {
                closeModal();
            }
        });

        // Load on startup
        refreshDetections();
    </script>
</body>
</html>
