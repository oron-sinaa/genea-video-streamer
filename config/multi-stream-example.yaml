# Multi-Stream Example Configuration
# Demonstrates how to configure multiple concurrent RTSP streams
# in Genea Video Streamer Phase 6

# Global settings
global:
  max_concurrent_streams: 5        # Maximum number of simultaneous streams
  log_level: INFO
  enable_metrics: true             # Enable health metrics collection

# Resource limits (per stream)
resources:
  max_cpu_percent_per_stream: 50    # CPU percentage per stream
  max_memory_per_stream: 256        # MB per stream

# HTTP server (single instance for all streams)
http:
  listen_port: 8080
  listen_address: "0.0.0.0"
  enable_cors: true
  max_concurrent_connections: 100

# Streams configuration (array of stream definitions)
streams:
  - name: "camera-front"
    enabled: true
    rtsp:
      url: "rtsp://192.168.1.100:554/stream1"
      reconnect:
        enabled: true
        initial_delay_ms: 1000
        max_delay_ms: 30000
        jitter_percent: 15
        stale_timeout_s: 10
    hls:
      segment_duration_s: 4
      enable_discontinuity_markers: true
      output_dir: "/data/segments/camera-front"  # Per-stream directory
      retention_segments: 10                      # Keep last 10 segments

  - name: "camera-side"
    enabled: true
    rtsp:
      url: "rtsp://192.168.1.101:554/stream1"
      reconnect:
        enabled: true
        initial_delay_ms: 1000
        max_delay_ms: 30000
        jitter_percent: 15
        stale_timeout_s: 10
    hls:
      segment_duration_s: 4
      enable_discontinuity_markers: true
      output_dir: "/data/segments/camera-side"
      retention_segments: 10

  - name: "camera-back"
    enabled: true
    rtsp:
      url: "rtsp://192.168.1.102:554/stream1"
      reconnect:
        enabled: true
        initial_delay_ms: 1500      # Staggered retry
        max_delay_ms: 30000
        jitter_percent: 15
        stale_timeout_s: 10
    hls:
      segment_duration_s: 4
      enable_discontinuity_markers: true
      output_dir: "/data/segments/camera-back"
      retention_segments: 10

  # Additional streams can be added here
  # - name: "camera-roof"
  #   enabled: false  # Disabled until camera is available
  #   rtsp:
  #     url: "rtsp://192.168.1.103:554/stream1"
  #   ...

# Monitoring and alerting configuration
monitoring:
  health_check_interval_s: 5        # Check stream health every 5 seconds
  enable_alerting: true
  alert_on_disconnection: true
  alert_reconnect_threshold: 5      # Alert if more than 5 reconnects per minute

# Metrics API (for Prometheus, Grafana, etc.)
metrics:
  enabled: true
  export_interval_s: 10
  include_per_stream_metrics: true  # Export per-camera metrics
  # metrics_endpoint: "http://prometheus:9090/metrics"  # Optional webhook

# Archive configuration (optional)
archive:
  enabled: false
  # output_dir: "/archive"
  # retention_days: 30
  # compression: "h264"  # Optional: compress archived segments
