# Single-Stream RTSP Ingest Configuration (Phase 6: Legacy Mode)
#
# This configuration ingests a single RTSP stream, converts it to HLS segments,
# and serves them via the embedded HTTP server. Supports automatic reconnection.
#
# Usage:
#   ./build/streamer --config config/rtsp-ingest.yaml

# RTSP source configuration
rtsp:
  # Full RTSP URL of the IP camera or streaming source
  # Examples:
  #   rtsp://camera.local:554/stream
  #   rtsp://user:password@192.168.1.100:554/stream1
  url: "rtsp://9627b0bf2a7b.entrypoint.cloud.wowza.com:1935/app-p5260J38/66abe4b9_stream1"
  # Transport protocol: "tcp" (recommended, reliable across NAT) or "udp"
  transport: "tcp"
  # Connection/read timeout in microseconds (5000000 = 5 seconds)
  timeout_us: 5000000
  # Reconnection policy on network outage (automatic recovery)
  reconnect:
    # Enable automatic reconnection on network errors
    enabled: true
    # Initial backoff delay in milliseconds (1000 = 1 second)
    initial_delay_ms: 1000
    # Maximum backoff delay in milliseconds (30000 = 30 seconds)
    max_delay_ms: 30000
    # Jitter variance in percentage to avoid thundering herd (15 = ±15%)
    jitter_percent: 15
    # Detect stale source (no packets received) and trigger reconnect after N seconds
    stale_timeout_s: 10

# HLS (HTTP Live Streaming) output configuration
hls:
  # Output directory for .ts segment files and .m3u8 playlists
  # Created if missing
  output_dir: "hls_output"
  # Target segment duration in seconds (typical range: 2-10s)
  # Lower = more granular live window, higher = fewer files but higher latency
  segment_duration_s: 3
  # How far back in time to retain archived segments for VOD (video-on-demand) playback
  archive_retention_hours: 2
  # How often to scan and delete old segments beyond retention
  cleanup_interval_s: 300
  # Write #EXT-X-DISCONTINUITY markers to playlists after reconnects
  # Helps players handle timeline gaps gracefully
  enable_discontinuity_markers: true

# HTTP server configuration (Phase 6: optional)
# The embedded HTTP server is always enabled and serves:
#   - Web player: http://localhost:8080/
#   - REST API: http://localhost:8080/api/health, /api/streams
#   - HLS segments: http://localhost:8080/hls/live.m3u8
http:
  listen_port: 8080

# Resource limits and constraints (Phase 6: optional)
# For single-stream mode, these are informational
resources:
  max_streams: 1
  max_cpu_per_stream: 1.0
  max_memory_per_stream: 512

