# AI Inference Configuration for Multi-Stream Deployment
#
# This configuration demonstrates multi-stream object detection.
# Each stream is processed independently by its own worker thread.
# All streams share a single YOLOv8n model and SQLite database (disambiguated by stream_id).

ai_inference:
  # Global Inference Settings (applied to all streams)
  model: yolov8n                    # 'yolov8n' (nano), 'yolov8s' (small), etc.
  classes: [person, car]            # Classes to detect (person=0, car=2,5,7)
  confidence_threshold: 0.5          # Detection confidence threshold (0-1)
  
  # Inference Behavior
  inference_interval_s: 5            # Process segment every N seconds
  frames_per_segment: 1              # Frames to extract per segment
  
  # Shared Infrastructure
  database_path: /app/database/detections.db  # Shared SQLite database for all streams
  
  # Performance
  max_workers: 4                     # CPU inference parallelism (per stream)
  batch_size: 1                      # Frames per batch
  device: cpu                        # 'cpu' (no GPU required)
  
  # Cleanup & Retention (applies to all streams)
  retention_days: 30                 # Keep detection frames N days
  
  # Annotation Style
  annotate_thickness: 2              # Bbox line thickness
  annotate_font_scale: 0.6           # Label text size
  annotation_quality: 85             # JPEG quality (0-100)
  
  # Logging
  log_level: INFO                    # DEBUG, INFO, WARN, ERROR
  log_detections: true               # Log each detection to console
  
  # Streams Configuration
  # Each stream is processed independently by its own DetectionWorker thread.
  # Set enabled=false to disable a stream without removing its config.
  streams:
    
    # Camera 1: Enabled, reads from local HLS, saves detections locally
    - stream_id: camera-1
      enabled: true
      hls_input_dir: /data/hls_output/camera-1
      detections_output_dir: /data/detections/camera-1
    
    # Camera 2: Disabled (no processing), but config is preserved for easy re-enable
    - stream_id: camera-2
      enabled: false
      hls_input_dir: /data/hls_output/camera-2
      detections_output_dir: /data/detections/camera-2
    
    # Camera 3: Enabled, reads from local HLS, saves detections locally
    - stream_id: camera-3
      enabled: true
      hls_input_dir: /data/hls_output/camera-3
      detections_output_dir: /data/detections/camera-3
